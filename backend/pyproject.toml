[project]
name = "lexgate-backend"
version = "0.1.0"
description = "LexGate backend: legal document QA with corrective RAG"
requires-python = ">=3.11,<3.12"
dependencies = [
    "langgraph>=1.2,<2",
    "langchain-core",
    "langchain-groq",
    "langchain-chroma",
    "langchain-huggingface",
    "sentence-transformers",
    "faiss-cpu",
    "chromadb",
    "tavily-python",
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "slowapi",
    "langsmith",
    "beautifulsoup4",
    "pymupdf",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
    "mypy",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: requires local models or built indexes"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"app/llm/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
