name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --directory backend --frozen
      - name: Lint
        run: |
          uv run --directory backend ruff check .
          uv run --directory backend ruff format --check .
          uv run --directory backend mypy --explicit-package-bases --disable-error-code=call-arg app
      - name: Test
        env:
          GROQ_API_KEY: ci-placeholder
          TAVILY_API_KEY: ci-placeholder
          LANGSMITH_TRACING: "false"
        run: uv run --directory backend pytest -m "not slow"
